<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Forms</title>
  </head>
  <body>
    <form>
      <fieldset>
        <legend>Ваши личные данные</legend>

        <label for="name">
          <span>Ваще имя</span>
          <input
            id="name"
            type="text"
            name="name"
            required
            placeholder="Имя"
            class="grow-up"
          />
        </label>

        <label for="age">
          <span>Ваш возраст</span>
          <input
            id="age"
            type="number"
            name="age"
            required
            placeholder="Возраст"
            class="grow-up"
          />
        </label>

        <label for="phone">
          <span>Ваш номер телефона</span>
          <input
            id="phone"
            type="tel"
            name="phone"
            required
            placeholder="Номер телефона"
            class="grow-up"
          />
        </label>

        <label for="email">
          <span>Ваша почта</span>
          <input
            id="email"
            type="email"
            name="email"
            required
            placeholder="Почта"
            class="grow-up"
          />
        </label>

        <label for="massage">
          <span>Сообщение</span>
          <textarea
            id="massage"
            name="massage"
            class="grow-up"
            placeholder="Ваше сообщение"
            required
          ></textarea>
        </label>

        <label for="acceptance" class="block">
          <input id="acceptance" type="checkbox" required />
          <span class="mb">Я принимаю правила</span>
        </label>
        <button>Отправить</button>
      </fieldset>
    </form>
  </body>
</html>
