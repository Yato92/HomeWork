<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice with tables</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <section>
      <div class="table-calendar">
        <table>
          <caption class="table-calendar-title">
            Июнь 2025
          </caption>

          <thead>
            <tr>
              <td>пн</td>
              <td>вт</td>
              <td>ср</td>
              <td>чт</td>
              <td>пт</td>
              <td class="table-calendar-specialDay">сб</td>
              <td class="table-calendar-specialDay">вс</td>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td colspan="6"></td>
              <td class="table-calendar-specialDay">01</td>
            </tr>
            <tr>
              <td>02</td>
              <td>03</td>
              <td>04</td>
              <td>05</td>
              <td>06</td>
              <td class="table-calendar-specialDay">07</td>
              <td class="table-calendar-specialDay">08</td>
            </tr>

            <tr>
              <td>09</td>
              <td>10</td>
              <td>11</td>
              <td>12</td>
              <td>13</td>
              <td class="table-calendar-specialDay">14</td>
              <td class="table-calendar-specialDay">15</td>
            </tr>

            <tr>
              <td>16</td>
              <td>17</td>
              <td>18</td>
              <td>19</td>
              <td>20</td>
              <td class="table-calendar-specialDay">21</td>
              <td class="table-calendar-specialDay">22</td>
            </tr>

            <tr>
              <td>23</td>
              <td>24</td>
              <td>25</td>
              <td>26</td>
              <td>27</td>
              <td class="table-calendar-specialDay">28</td>
              <td class="table-calendar-specialDay">29</td>
            </tr>

            <tr>
              <td>30</td>
              <td colspan="6"></td>
            </tr>
          </tbody>

          <tfoot>
            <tr>
              <td colspan="7">next month >>></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </section>
  </body>
</html>
